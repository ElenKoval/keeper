<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Об авторе и мире — Мир Дриады</title>
<meta name="description" content="SunnyChimera. Этот мир ещё растёт.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=PT+Serif:ital@0;1&family=Forum&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0908;--ink:#ebe5d8;--dim:#8f8f8f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'PT Serif',Georgia,serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
#roots{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#roots path{fill:none;stroke:#cfc8bb;stroke-linecap:round}
.back{position:fixed;top:22px;left:22px;z-index:2;color:#bdbdbd;text-decoration:none;font-size:1rem}
.back:hover{color:#fff}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 16px 40px;text-align:center}
h1{font-family:'Forum',Georgia,serif;font-weight:400;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(1.3rem,4vw,1.9rem);margin:0 0 8px;padding-left:.32em}
.sub{margin:0 0 56px;font-style:italic;font-size:1rem;color:#8a8580}
.paper{position:relative;width:min(340px,100%);padding:38px 30px 26px;font-family:'Caveat',cursive;color:#2b2925;text-align:left;
  background:radial-gradient(circle at 30% 20%,#f4efe4,#e6dfd0 70%,#d9d1bf);box-shadow:0 10px 28px rgba(0,0,0,.6);transform:rotate(-2.4deg);
  clip-path:polygon(0 3%,8% 0,22% 2%,37% 0,55% 1.5%,71% 0,86% 2%,100% 0,99% 22%,100% 48%,98% 71%,100% 93%,93% 100%,78% 97%,64% 100%,47% 98%,33% 100%,18% 97%,4% 100%,1% 78%,0 52%,2% 27%)}
.nail{position:absolute;top:12px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8d8a84,#2a2723 70%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.paper .lab{margin:0 0 10px;font-size:1.15rem;color:#6b665d;transform:rotate(-1deg)}
.paper a{display:inline-block;font-size:1.65rem;line-height:1.1;color:#2b2925;text-decoration:none;border-bottom:1px solid rgba(43,41,37,.35);overflow-wrap:normal}
.paper a:hover{border-bottom-color:#2b2925}
.paper .hint{margin:14px 0 0;font-size:1.2rem;color:#4a463f;transform:rotate(.6deg)}
footer{position:relative;z-index:1;padding:18px 16px 22px;text-align:center;font-size:.78rem;color:#6f6a63}
footer .ai{display:block;margin-top:4px}
.lang{position:fixed;top:20px;right:22px;z-index:2;background:none;border:1px solid #3a3a3a;color:#bdbdbd;font:inherit;font-size:.8rem;padding:3px 8px;cursor:pointer}
.lang:hover{color:#fff;border-color:#777}
@media (prefers-reduced-motion:reduce){#roots .sway{animation:none}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--d,9s) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--a,.6deg) * -1))}to{transform:rotate(var(--a,.6deg))}}
</style>
</head>
<body>
<svg id="roots" aria-hidden="true"></svg>
<a class="back" href="index.html" data-t="back">← К Киперу</a>
<button class="lang" id="lang" type="button">EN</button>

<main>
  <h1>SunnyChimera</h1>
  <p class="sub" data-t="tag">этот мир ещё растёт</p>
  <section class="paper" aria-label="Контакт">
    <span class="nail"></span>
    <p class="lab" data-t="mailLabel">Шёпот из человеческого мира</p>
    <a href="mailto:sunnychimeraworld@gmail.com">sunnychimeraworld@<wbr>gmail.com</a>
    <p class="hint" data-t="mailHint">Напиши — иногда письмо находит дорогу.</p>
  </section>
</main>

<footer>
  <span data-t="legal">© 2026 sunnyChimera. Тексты и рисунки. Все права защищены · Персонажи отвечают с помощью ИИ</span>
</footer>

<script>
const T = {
  ru:{title:'Об авторе и мире — Мир Дриады',back:'← К Киперу',tag:'этот мир ещё растёт',mailLabel:'Шёпот из человеческого мира',mailHint:'Напиши — иногда письмо находит дорогу.',legal:'© 2026 sunnyChimera. Тексты и рисунки. Все права защищены · Персонажи отвечают с помощью ИИ',btn:'EN'},
  en:{title:"About — The Dryad's World",back:'← To Kiper',tag:'this world is still growing',mailLabel:'A whisper from the human world',mailHint:'Write — sometimes a letter finds its way.',legal:'© 2026 sunnyChimera. Texts and drawings. All rights reserved · Characters respond with AI',btn:'RU'}
};
let L = 'ru'; try { L = localStorage.getItem('keeper-lang') === 'en' ? 'en' : 'ru'; } catch(e) {}
function apply(){ const t = T[L]; document.documentElement.lang = L; document.title = t.title;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; }); document.getElementById('lang').textContent = t.btn; }
document.getElementById('lang').onclick = () => { L = L === 'ru' ? 'en' : 'ru'; try { localStorage.setItem('keeper-lang', L); } catch(e) {} apply(); };
apply();
// тонкие Нити снизу, как на главной
(function(){ const s = document.getElementById('roots'), W = innerWidth, H = innerHeight, r = (a,b) => a + Math.random()*(b-a);
  s.setAttribute('viewBox', `0 0 ${W} ${H}`); let g = '';
  for (let i = 0, n = Math.round(W/70); i < n; i++){ const x = r(0,W), z = Math.random(), len = (.18 + z*.32) * H; let d = `M${x.toFixed(1)} ${H+4}`, cx = x; const k = 5;
    for (let j = 1; j <= k; j++){ const ny = H - len*j/k, nx = x + r(-14,14); d += ` Q${(cx+r(-14,14)).toFixed(1)} ${(ny+len/k/2).toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)}`; cx = nx; }
    g += `<g class="sway" style="--d:${r(7,13).toFixed(1)}s;--a:${r(.4,1).toFixed(2)}deg" opacity="${(.08 + z*.22).toFixed(2)}"><path d="${d}" stroke-width="${(.6 + z*1.6).toFixed(2)}"/></g>`; }
  s.innerHTML = g; })();
</script>
</body>
</html>
